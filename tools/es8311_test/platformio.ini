; Isolated hardware bring-up test for the ES8311 audio codec on
; MeshAdventurer-S3 (ESP32-S3). Fully separate PlatformIO project, deliberately
; not wired into the main repo's platformio.ini/build - see README.md.

[env:meshadventurer_s3_es8311_test]
; Same toolchain release the main firmware's [env:meshadventurer_s3] pins
; (../../platformio.ini), so the compiler/SDK is already cached locally.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_upload.flash_size = 16MB
; qio_opi matches this board's real Octal PSRAM wiring (see the main
; platformio.ini's meshadventurer_s3 env) - this test doesn't need PSRAM, but
; leaving memory_type at the board-correct value avoids any chance of a
; boot-time PSRAM init mismatch on real hardware.
board_build.arduino.memory_type = qio_opi
; No board_build.partitions override -> uses the default factory partition
; table. Deliberately NOT reusing ../../partitions/meshadventurer_s3_urns.csv
; - that 5-partition scheme is sized for the real firmware + URNS LittleFS
; filesystem, irrelevant to this throwaway sketch.

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Matches the real board's own working env - needed for native USB-CDC
    ; Serial to enumerate reliably. If the serial monitor doesn't show up
    ; after flashing, also try -DARDUINO_USB_MODE=1.
    -DBOARD_HAS_PSRAM
    ; Required for psramFound()/heap_caps_malloc(..., MALLOC_CAP_SPIRAM) to
    ; actually see the PSRAM (recorder.cpp) - the generic "esp32-s3-devkitc-1"
    ; board JSON has no PSRAM SKU variant, so board_build.arduino.memory_type
    ; alone (below) selects the right Octal-PSRAM core variant but doesn't
    ; itself define this macro. Same footgun the main platformio.ini's
    ; meshadventurer_s3 env already hit and documents.
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; Arduino-ESP32's loop() task defaults to an 8KB stack - too small for
    ; Codec2's internal DSP calls (nlp.c pitch estimation, FFT work buffers
    ; in codec2_fft.c/quantise.c) run synchronously from runCodec2AndPlay()
    ; (main.cpp). Confirmed on real hardware: codec2_create()/encode()/
    ; decode() crashed with "Stack canary watchpoint triggered (loopTask)"
    ; at the default 8KB. Same fix, same value, as the main platformio.ini's
    ; meshadventurer_s3 env already uses for its own (different) deep-call-
    ; chain overflow - see that file's own comment on this flag.

lib_deps =
    adafruit/Adafruit GFX Library@^1.12.6
    adafruit/Adafruit SSD1306@^2.5.16
    adafruit/Adafruit BusIO@^1.17.4

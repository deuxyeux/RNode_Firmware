; Isolated hardware bring-up test for an SPI SD card wired to spare pads on
; a ProMicro/FakeTec (nice!nano v2) board - see README.md for the "why".
; Fully separate PlatformIO project, deliberately not wired into the main
; repo's platformio.ini/build, same pattern as ../es8311_test.

[platformio]
; This project's own src/ dir - keeps it out of the way of the main repo's
; src_dir = RNode_Firmware setting (that setting is per-project, but stated
; explicitly here for clarity since this file lives in a subfolder).
src_dir = src
build_dir = .pio_build
; board.json isn't shipped by the nordicnrf52 platform itself - it's a
; project-local file (../../boards/promicro.json). PlatformIO's default
; local board search path is a "boards/" dir next to platformio.ini, which
; doesn't exist here, so point it at the main repo's copy instead of
; duplicating the file. (Option is "boards_dir", plural, and belongs in
; this [platformio] section, not the [env:] one.)
boards_dir = ../../boards

[env:faketec_sdcard_test]
; Same platform/board/framework triple as the main platformio.ini's own
; [env:promicro] (../../platformio.ini) - this is the exact same physical
; core (promicro:nrf52 / pdcook/nRFMicro-Arduino-Core, nice!nano v2 variant),
; just a throwaway sketch instead of the real firmware.
platform = nordicnrf52
board = promicro
framework = arduino
; Reuses the main repo's already-vendored core symlink (../../.pio_vendor/
; promicro_nrf52_framework -> ~/.cache/rnode_nrf52_cores/promicro_nrf52-1.0.2)
; instead of re-running setup_promicro_nrf52_pio.sh for a second copy.
platform_packages =
	platformio/framework-arduinoadafruitnrf52 @ symlink://../../.pio_vendor/promicro_nrf52_framework
monitor_speed = 115200

lib_deps =
	greiman/SdFat@^2.3.1

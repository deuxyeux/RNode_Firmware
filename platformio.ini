; unresolved-without-real-hardware ambiguity as heltec32v3's own comment,
; defaulted the same way to arduino-cli's value) and PSRAM chip type
; (board.json defaults arduino.memory_type to qio_opi/Octal, but
; arduino-cli's own compile recipe for this exact FQBN selects qio_qspi/Quad
; headers - real hardware has 2MB Quad PSRAM, not Octal). BOARD_HAS_PSRAM is
; deliberately NOT set here, matching the Makefile's own firmware-xiao_s3
; target - it doesn't pass that define either, so PSRAM stays inert at
; runtime even though the qio_qspi variant headers are selected.
; ============================================================================

[env:xiao_esp32s3]

; same pin-number space, not a different chip/variant. So this env just
; reuses "board = rak4631" wholesale (same boards/rak4631.json, same vendored
; framework symlink) - Boards.h's own BOARD_RAK3401 pin block (const int
; pin_cs/pin_sclk/... = specific numbers) is what actually differs, not the
; underlying variant/toolchain.

	bblanchon/ArduinoJson@~7.4.2

; See [env:heltec_t096]'s own comment on why the vendored URNS stack needs
; excluding even though HAS_URNS is false - PlatformIO's library dependency
; finder resolves #include chains via a text scan, not the real

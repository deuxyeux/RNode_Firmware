	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2

[env:heltec_wtracker_v2]
; Heltec Wireless Tracker V2 (Boards.h: BOARD_HELTEC_WTRACKER_V2, 0x46) -
; ESP32-S3FN8, same generic esp32s3 profile as [env:heltec32v4pa] above. No
; physical unit available - see Boards.h's own BOARD_HELTEC_WTRACKER_V2
; comment for the cross-referenced pin sourcing (Meshtastic's and MeshCore's
; own variant defs for this board, which agree on every pin).
;
; PSRAM: none - ESP32-S3FN8 is the flash-only (8MB), no-PSRAM SKU of the
; ESP32-S3 (unlike heltec32v4pa's QSPI or meshadventurer_s3/meshpoe_s3's
; Octal PSRAM above), so no board_build.arduino.memory_type/-DBOARD_HAS_PSRAM
; override is set here - the generic esp32s3 profile's own default (PSRAM
; disabled) is already correct.
;
; Partition table: default_8MB.csv, matching both Meshtastic's and
; MeshCore's own board.json for this board (bundled by PlatformIO's
; espressif32 platform under that name, same as no_ota.csv above) - gives a
; single ~3.2MB app partition plus SPIFFS, unlike heltec32v4pa's no_ota
; scheme which only uses the first 4MB of its 16MB flash.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 3342336

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>

build_flags =
	-DBOARD_MODEL=0x46
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; Same list as [env:heltec32v4pa] above, plus the ST7735 TFT driver library
; that board's own lib_deps is missing (harmless there since Adafruit_
; ST7735.h is only ever #included on BOARD_HELTEC_T096/BOARD_HELTEC_T114/
; this board - PlatformIO's LDF only resolves what it can text-scan to, so
; a missing-but-unreached header doesn't fail the T096 nRF52 env, but this
; board needs it since it's the actual display driver in use here).
lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	links2004/WebSockets@^2.7.2
	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2

; SD added here specifically - Console.h's "#include \"SD.h\"" (line ~20) is
; unconditional (only the actual use is gated behind #if HAS_SD, which is
; false on every board including this one), so PlatformIO's LDF still pulls
; the SD library into the dependency graph and compiles it regardless. Every
; other board tolerates that fine, but this board's variant of the SD
; library's own Sd2PinMap.h ("Architecture or board not supported") doesn't
; recognize it, breaking the build over a library this board (like every
; other) never actually uses. Safe to ignore - HAS_SD false means nothing in
; the compiled code path touches it.
lib_ignore =
	microReticulum
	microLXMF
	MsgPack
	microStore
	SD

[env:tbeam_1w]
; LilyGO T-Beam 1W (Boards.h: BOARD_TBEAM_1W, 0x45) - ESP32-S3 + SX1262
; driving an external XY16P35 1W PA/LNA module. Not a HAS_URNS board - same
; "fast regression-check target" reasoning as [env:heltec32v4pa] above.
;
; PSRAM: Octal, same board_build.arduino.memory_type=qio_opi/-DBOARD_HAS_PSRAM
; pairing as [env:meshadventurer_s3]/[env:meshpoe_s3] above (Meshtastic's and
; MeshCore's own board.json for this board both specify "psram_type": "opi",
; "memory_type": "qio_opi") - see meshadventurer_s3's own comment on why both
; of these are needed together on PlatformIO's espressif32 builder,
; specifically. flash_size/maximum_size mirror the Makefile's own
; firmware-tbeam_1w target (16MB flash, default_16MB.csv - PlatformIO's
; espressif32 platform bundles the identical file under that name, same as
; no_ota.csv above).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>

build_flags =
	-DBOARD_MODEL=0x45
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	; See [env:meshadventurer_s3]'s own comment on this - same CDCOnBoot=cdc-
	; equivalent requirement for the KISS host link over native USB CDC.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; See [env:meshadventurer_s3]'s own comment on why this is needed
	; alongside memory_type=qio_opi above, specifically on this builder.
	-DBOARD_HAS_PSRAM

; PlatformIO doesn't inherit lib_deps across [env:] sections - see
; [env:heltec_t096]'s own comment on this list. Adafruit SH110X replaces
; SSD1306 here (this board's OLED is an SH1106, same controller family as
; BOARD_TBEAM_S_V1/V3 - see Display.h's own BOARD_MODEL == BOARD_TBEAM_1W
; branches), everything else is the same base set as the other ESP32(-S3)
; envs above.
lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SH110X@^2.1.13
	adafruit/Adafruit Unified Sensor@^1.1.15
	links2004/WebSockets@^2.7.2
	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2

; See [env:heltec_t096]'s own comment on why the vendored URNS stack needs
; excluding even though HAS_URNS is false for this board.
lib_ignore =
	microReticulum
	microLXMF
	MsgPack
	microStore

[env:promicro]
; "ProMicro"/"FakeTec" (Boards.h: BOARD_PROMICRO, 0xF5) - a DIY, hand-wired
; board (HAS_GPIO_MENU, runtime pin reassignment), not a fixed Heltec PCB.
; The Makefile's own target builds it against a nice!nano v2
; (promicro:nrf52:nicenanov2:softdevice=s140v6 - a THIRD, different
; third-party core from Heltec_nRF52: promicro:nrf52, github.com/pdcook/
; nRFMicro-Arduino-Core) - same nRF52840/S140 6.1.1/nrfutil shape as
; T096/T114 above, but not the same vendor package, so it needs its own
; .pio_vendor/promicro_nrf52_framework/ (setup_promicro_nrf52_pio.sh,
; requires `arduino-cli core install promicro:nrf52`) - see that script's
; own comment for why it's vendored the same way as Heltec's core even
; though this one already has a proper root package.json (no poison-pill
; problem here, vendored anyway for consistency/future-proofing).
platform = nordicnrf52
board = promicro
framework = arduino
platform_packages =
	platformio/framework-arduinoadafruitnrf52 @ symlink://./.pio_vendor/promicro_nrf52_framework
monitor_speed = 115200

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>

build_flags =
	-DBOARD_MODEL=0xF5
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"

lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2

; No "Heltec" library to ignore here (unlike T096/T114 above) - this
; core's own bundled libraries (Adafruit_LittleFS/nRFCrypto/TinyUSB, BLE*,
; PDM, RotaryEncoder, Servo, SoftwareSerial) don't include anything

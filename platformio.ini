	-std=gnu++11
build_flags =
	-std=gnu++17
	-DBOARD_MODEL=0x3F
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-DBOARD_HAS_PSRAM
	-DHAS_URNS=true
	-DHAS_LXMF=true
	-DHAS_BLE_HID_HOST=true
	-DHAS_CONSOLE=false
	; HAS_DEBUG_UART is #ifndef-guarded globally (Boards.h), same mechanism
	; as HAS_URNS/HAS_LXMF above - GPIO43 TX/GPIO44 RX (Serial0/UART0) is
	; free and unclaimed on this board too, same as MeshPoE-S3's own
	; HAS_DEBUG_UART block (Boards.h) - Serial is remapped to native USB
	; CDC here (ARDUINO_USB_CDC_ON_BOOT=1 above) for the same reason.
	; Wired live 2026-09-21 to chase the periodic crash/reset
	; [env:heltec32v4pa_urns_ble] shows on real hardware - a USB-UART
	; adapter (CH343) on those two pins + GND, 115200 baud.
	-DHAS_DEBUG_UART=true
	-DMSGPACK_USE_BOOST=OFF
	-DDEBUGLOG_DEFAULT_LOG_LEVEL_TRACE
	-DRNS_USE_FS
	-DUSTORE_USE_LITTLEFS
	-DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
	-DRNS_ENABLE_REMOTE_PROVISIONING
	-DRNS_USE_PROVISIONING
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
	-DARDUINO_LOOP_STACK_SIZE=32768


; WisCore_RAK4600_Board/WisCore_RAK4631_Board exist), and this repo only
; vendors that same core (see [env:rak4631] above) - no RAK3401 variant to
; point at. Meshtastic hits the exact same gap and solves it the same way
; (variants/nrf52840/rak3401_1watt/platformio.ini: "board = wiscore_rak4631"):
; RAK3401's variant.h literally starts with "#define RAK4630" and reuses the

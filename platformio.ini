; partitions/xiao_esp32s3.csv's own comment for the corrected partition
; layout (app0 doubled to 4MB, spare margin left unallocated) and for why
; PSRAM is deliberately NOT touched by this change (separate, unresolved
; 2MB-Quad-vs-8MB-Octal contradiction - see that file's comment).

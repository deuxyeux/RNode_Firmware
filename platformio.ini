[env:heltec32v4pa_urns_ble]
; Real deployed board (rnode_firmware_heltec32v4pa_urns_ble.zip ships on the
; flasher), layering HAS_LXMF (Messenger app) and HAS_BLE_HID_HOST (BLE
; keyboard host) on top of what [env:heltec32v4pa_urns] already proved for
; plain HAS_URNS.
;
; BUILD VIA scripts/pio_build.sh heltec32v4pa_urns_ble, NOT raw `pio run` -
; this board's real Quad/2MB PSRAM chip (confirmed via live debug-UART
; capture 2026-09-21) fails ID readback and crashes before app_main() every
; boot under the Octal sdkconfig.defaults settings [env:meshadventurer_s3]/
; [env:meshpoe_s3] need, and sdkconfig.defaults has no per-env scoping (see
; that file's own PSRAM comment) - one shared file, project-root-only. The
; wrapper script applies this env's Quad/ESPPSRAM16 override automatically
; and restores the committed Octal/AUTO file afterward even on failure. A
; plain `pio run -e heltec32v4pa_urns_ble` (e.g. inside a mass-build loop)
; silently ships this board broken; the old manual edit-build-revert dance
; silently broke meshadventurer_s3/meshpoe_s3 instead whenever the revert
; step was skipped - both have actually happened in production (see
; [[project_heltec32v4_ble_psram_crash]] memory for the original diagnosis).
;
; HAS_LXMF: works the same #ifndef-global-fallback way HAS_URNS does
; (Boards.h) - this board's block never sets it itself, so the build flag
; below is the only place it's set, same reasoning [env:heltec32v4pa_urns]
; already established for HAS_URNS.
;
; HAS_BLE_HID_HOST: Boards.h's own global default used to be a plain
; unconditional "#define HAS_BLE_HID_HOST false" (no #ifndef guard, unlike
; HAS_URNS/HAS_LXMF) - just changed to match their pattern specifically so
; this build flag can work at all; MeshAdventurer-S3's own board-specific
; #undef/#define true override is untouched and still takes precedence
; there regardless of the guard style.
;
; framework = arduino, espidf (combined mode) is NOT optional here, unlike
; [env:heltec32v4pa_urns]'s plain "arduino" - BLE HID host needs
; CONFIG_BT_NIMBLE_HID_SERVICE (sdkconfig.defaults, project root) to link
; esp_hidh_dev_open()/esp_ble_hidh_init() at all, and that Kconfig option
; is only reachable via a real ESP-IDF CMake build; plain "arduino" mode
; links against Espressif's own precompiled framework-arduinoespressif32-
; libs, built with this project's local sdkconfig.defaults never applied.
; sdkconfig.defaults itself is a single shared file, no per-env scoping in
; this platform version (see its own header comment) - this env picks up
; the exact same Kconfig set [env:meshadventurer_s3] already uses,
; including the PSRAM/WiFi/lwIP tuning that board needed, EXCEPT the PSRAM
; mode/type lines themselves (own paragraph above).
;
; scripts/pio_build.sh also deletes the stale sdkconfig.heltec32v4pa_urns_ble
; file this env generates at the project root before rebuilding -
; PlatformIO/ESP-IDF treats that file as the real, persistent, already-
; merged config once it exists, and silently ignores further
; sdkconfig.defaults changes otherwise (confirmed the hard way - two
; separate sdkconfig.defaults edits were silently no-ops until this was
; caught). It's gitignored (.gitignore) and safe to delete any time; it
; just regenerates on the next build.
; -fexceptions/-frtti deliberately dropped from build_flags (unlike
; [env:heltec32v4pa_urns]'s own copy of them) - same C-only-managed-
; component conflict [env:meshadventurer_s3]'s own comment on this
; describes; sdkconfig.defaults' CONFIG_COMPILER_CXX_EXCEPTIONS/_RTTI
; cover the requirement instead, correctly scoped to C++ only.
;
; Partition table: partitions/heltec32v4pa_urns_ble.csv (own file, own
; comment) - app0 grown from heltec32v4pa_urns.csv's 2MB to 3MB, since a
; full HAS_URNS+HAS_LXMF+HAS_BLE_HID_HOST build doesn't fit in 2MB
; (meshadventurer_s3's own equivalent build is already ~2.47MB).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions/heltec32v4pa_urns_ble.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>


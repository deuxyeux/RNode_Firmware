; small #ifndef guard added around this board's own unconditional
; #define HAS_CONSOLE true (Boards.h, BOARD_HELTEC32_V4 block) since nothing
; else in this file gates it that way. Everything else below (std=gnu++17/
; exceptions/RTTI, RNS_USE_FS/USTORE_USE_LITTLEFS, PSRAM allocator,
; provisioning, loop stack size, lib_ignore left empty) is copied verbatim
; from [env:meshadventurer_s3]/[env:meshpoe_s3]'s own already-proven URNS
; requirements below - not Heltec-V4-specific, just what the vendored
; microReticulum/microLXMF stack needs to build and run correctly on any
; board (see those envs' own comments for the reasoning behind each one,
; especially the loop stack size - undersized there causes real random
; reboots under LXMF traffic). Partition table is a dedicated
; partitions/heltec32v4pa_urns.csv, NOT the stock no_ota.csv - URNS.h's
; urns_init() mounts LittleFS by the literal partition label "urns", which

	microLXMF
	MsgPack
	microStore

; ============================================================================
; Heltec32-V2/V3 and the TTGO-LoRa32-family boards (LoRa32-V1.0/V2.0/V2.1/
; V2.1-TCXO, RNode NG 2.0/2.1) below - unlike Heltec32-V4 above, the
; Makefile's own arduino-cli targets for ALL of these DO use their proper
; vendor-specific FQBNs (esp32:esp32:heltec_wifi_lora_32_V2/_V3,
; esp32:esp32:ttgo-lora32 - no "V4 with PA"-style conflict here to avoid),
; and PlatformIO's own espressif32 platform already has matching boards
; for every one of them (heltec_wifi_lora_32_V2/_V3.json,
; ttgo-lora32-v1.json) - no custom board.json/vendoring needed at all,
; unlike the nRF52 boards above. All six ttgo-lora32-based envs
; (lora32v10/v20/v21/v21_tcxo, ng20/21) share literally the same
; arduino-cli board (esp32:esp32:ttgo-lora32, PlatformIO's ttgo-lora32-v1)
; - Boards.h's own BOARD_MODEL-driven #elif differentiates them at the C++
; level, matching how arduino-cli treats them identically at the board
; level too.
;
; Flash mode/frequency: cross-checked each board's actual resolved values
; via `arduino-cli --show-properties` against PlatformIO's own board.json
; defaults, same methodology as Heltec32-V4's PSRAM/flash-size correction
; above - overridden below wherever they disagreed, to match what
; arduino-cli's board profiles (the actually-shipped/tested Makefile
; behavior) resolve to rather than trusting PlatformIO's community-
; contributed defaults blindly. heltec_wifi_lora_32_V3 is the one
; genuinely unresolved case (PlatformIO's own board.json claims qio,
; arduino-cli's claims dio, for the exact same board) - no real V3
; hardware on hand to verify via esptool/eFuse the way V4's PSRAM/flash-
; size question was settled, so defaulted to arduino-cli's dio as the
; more conservative/proven-shipped choice; worth confirming on real
; hardware before relying on this for an actual flash.
; ============================================================================


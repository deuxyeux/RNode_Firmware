; ============================================================================
; nRF52 boards below: RAK4631 (WisBlock) and T-Echo. Neither PlatformIO's
; bundled nordicnrf52 platform nor Heltec's/promicro's own vendored cores
; above know either of these - both need their own custom board.json
; (boards/rak4631.json, boards/techo.json) plus a small symlink-vendored
; framework shim (setup_rak4631_nrf52_pio.sh, setup_techo_nrf52_pio.sh),
; same shape/reasoning as [env:heltec_t096]'s own comment on
; platform_packages/.pio_vendor/lib_ignore - all of it applies here too,
; just against a different pair of third-party cores
; (rakwireless:nrf52/adafruit:nrf52 rather than Heltec_nRF52/promicro:nrf52).
; board.json's own "board" id (rak4631/techo) resolves to
; boards/rak4631.json/boards/techo.json via PlatformIO's project-local board
; search path - no "vendor:board" prefix needed, unlike arduino-cli's FQBN.
; ============================================================================

[env:rak4631]
platform = nordicnrf52
board = rak4631
framework = arduino
platform_packages =
	platformio/framework-arduinoadafruitnrf52 @ symlink://./.pio_vendor/rak4631_nrf52_framework
monitor_speed = 115200
; See pio_scripts/rak4631_fix_wrap_flags.py's own comment - this core's
; heap_3.c is missing two allocator wrapper symbols PlatformIO's adafruit.py
; framework builder assumes exist, confirmed via a real link failure.
extra_scripts = post:pio_scripts/rak4631_fix_wrap_flags.py

; HAS_BLE is true for this board (Boards.h), and Utilities.h unconditionally
; #includes Adafruit_LittleFS.h too (nRF52 EEPROM emulation) - both
; Bluefruit52Lib (which itself declares "depends=Adafruit nRFCrypto" in its
; own library.properties, byte-identical to the copy bundled with Heltec's/
; promicro's own vendored cores above) and Adafruit_LittleFS live in this
; core's own libraries/ dir (confirmed present on disk, correct
; library.properties) but PlatformIO's LDF failed to resolve either one
; here specifically - confirmed via real build failures (fatal errors on
; Adafruit_nRFCrypto.h, then Adafruit_LittleFS.h, not found on the include
; path) the first time this freshly-symlinked vendored package was scanned,
; unlike the already-cached Heltec/promicro ones (same core family, never
; hit this). Neither "deep+" LDF mode nor relying on declared "depends"
; metadata fixed it reliably, so pinned explicitly below via local file://
; specs instead of leaving framework-bundled auto-discovery to sort it out.
build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>

build_flags =
	-DBOARD_MODEL=0x51
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	; Bluefruit52Lib's own sources (BLESecurity.h) #include "Adafruit_nRFCrypto.h"
	; directly - the file://-pinned lib_deps entry below gets the library
	; itself compiled, but LDF never wires up the dependency edge from
	; Bluefruit52Lib to it (same "depends=" resolution failure noted above),
	; so Bluefruit52Lib's own compile still can't find the header without
	; this explicit include path.
	-I.pio_vendor/rak4631_nrf52_framework/libraries/Adafruit_nRFCrypto/src
	; Adafruit_nRFCrypto links against a prebuilt nRF52840 CC310 hardware-
	; crypto-accelerator archive (nrf_cc310, bundled as a raw .a, not built
	; from source) - same resolution gap as above, LDF never wires up its
	; -L search path either.
	-L.pio_vendor/rak4631_nrf52_framework/libraries/Adafruit_nRFCrypto/src/cortex-m4/fpv4-sp-d16-hard

lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	https://github.com/attermann/Crypto.git
	Adafruit_LittleFS=file://.pio_vendor/rak4631_nrf52_framework/libraries/Adafruit_LittleFS
	Adafruit_nRFCrypto=file://.pio_vendor/rak4631_nrf52_framework/libraries/Adafruit_nRFCrypto
	bblanchon/ArduinoJson@~7.4.2

; No "Heltec" library to ignore here (unlike T096/T114) - this core's own
; bundled libraries don't include anything comparable to Heltec's
; proprietary LoRaWAN stack.
lib_ignore =
	microReticulum
	microLXMF
	MsgPack
	microStore


; ============================================================================
; Generic ESP32-S3 (esp32:esp32:esp32s3:CDCOnBoot=cdc, no PSRAM menu option
; selected - PlatformIO's esp32-s3-devkitc-1) boards below: Aethernode-S3,
; T3S3 (SX1262/SX1276/SX1280 variants), T-Deck, T-Beam Supreme (V1/V3).
; Unlike meshadventurer_s3/meshpoe_s3/heltec32v4pa/tbeam_1w above, none of
; these set board_build.arduino.memory_type (no PSRAM on any of them, same
; as the Makefile's own arduino-cli targets for this group - none pass a
; PSRAM-related build-property either) - so PlatformIO's own
; esp32-s3-devkitc-1 board.json default flash_mode (qio) applies instead of
; whatever memory_type would otherwise select. Cross-checked via
; --show-properties: arduino-cli resolves flash_mode=dio for this exact
; FQBN (no PSRAM) - overridden below on every env in this group, same
; correction methodology as heltec32v3's own flash_mode comment.
; f_flash (80MHz) already matches without an override.
; ============================================================================

[env:aethernode_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = no_ota.csv
; esp32-s3-devkitc-1's own default (8MB) doesn't match this board's actual
; flash chip - htdocs/index.html's fc('rnode_firmware_aethernode_s3', ...)
; in the flasher repo already declares 16MB from field use; match it here
; so this env's build metadata (and gen_manifest.py's manifest.json output)
; doesn't silently fall back to the wrong generic-devkit default.
board_upload.flash_size = 16MB
board_upload.maximum_size = 2097152

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>


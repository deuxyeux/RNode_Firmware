; PlatformIO build - originally started for MeshAdventurer-S3/MeshPoE-S3
; (the microReticulum onboard-node work, branch: microreticulum-onboard-node/
; meshpoe-s3-urns) plus a handful of other boards added purely as fast,
; reliable non-HAS_URNS regression-check targets (the arduino-cli/Makefile
; path is slower and, for the two HAS_URNS boards, doesn't even work - its
; library resolution isn't set up for the vendored lib/ tree the way this
; file's own build_src_filter hands off to PlatformIO's library scanner).
; Since then, every board except the two AVR targets (rnode, mega2560 -
; unmigrated: rnode's own unsignedio:avr core isn't even installable via
; this repo's arduino-cli.yaml today, and porting a second, structurally
; different MCU family - AVR vs. ESP32/nRF52 - was left out of this pass)
; and the "_extled" variants (deliberately skipped - external-LED wiring
; variants of boards already covered here under their non-extled name) has
; been migrated too. PlatformIO is now the project's primary/authoritative
; build system: this file's per-env config (board, board_build.partitions,
; board_upload.flash_size, etc.) is the source of truth scripts/gen_manifest.py
; reads to generate each board's manifest.json (see the Makefile's release-*
; targets, which now call it), even for boards whose actual release binaries
; still come out of the arduino-cli/Makefile compile step.

[platformio]
; RNode_Firmware/ (not "src/") so the same directory also satisfies
; arduino-cli's sketch-name convention (folder name must match the primary
; .ino's basename) - Makefile's arduino-cli invocations point here too.
src_dir = RNode_Firmware
build_dir = .pio_build

[env:meshadventurer_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Combined mode (Arduino built as an ESP-IDF component from source) instead
; of plain "arduino" (precompiled framework-arduinoespressif32-libs) - needed
; to enable CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP (moves WiFi/lwIP's own
; internal buffers into PSRAM to relieve internal-DRAM pressure at ~94%
; utilization with BLE+WiFi/URNS+LoRa all on). That Kconfig option is baked
; OFF in the prebuilt liblwip.a/libnet80211.a under plain "arduino" - there's
; no flag that can change it there. See sdkconfig.defaults (project root) for
; the actual Kconfig - note only THIS env uses combined mode for now; that
; file is shared by every env with "espidf" in its framework list (this
; platform version has no per-env sdkconfig scoping), so a second combined-
; mode env later would need to share it or the build restructured.
;
; Note: this project used to set [platformio] src_dir=. at the project
; root, which collided with combined mode's own main-component generation
; (both resolved to the same file, crashing the component scan with
; "define_property command is not scriptable"). Fixed by moving all
; sources into RNode_Firmware/ (see src_dir above) - prototyped and
; validated in a scratch clone before being ported into this repo.
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions/meshadventurer_s3_urns.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>
	; ^ lib/ (vendored MsgPack/microLXMF) is handled by PlatformIO's own
	; library scanning, scoped correctly to each library's src/ - without
	; this, src_dir=. also sweeps it in wholesale, redundantly compiling
	; things like microLXMF's own conformance-bridge/ test tooling too.

build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	; -fexceptions/-frtti deliberately NOT set here (unlike every other env) -
	; under this env's combined "arduino, espidf" mode, build_flags entries
	; get applied as blanket compile options to EVERY translation unit CMake
	; builds, including the auto-fetched managed_components' plain C files
	; (esp-dsp, esp-modbus, etc, pulled in transitively, irrelevant to this
	; project) - confirmed empirically: with these flags present, C-only
	; files failed with "-frtti valid for C++/D/ObjC++ but not for C
	; [-Werror]". sdkconfig.defaults' CONFIG_COMPILER_CXX_EXCEPTIONS/
	; CONFIG_COMPILER_CXX_RTTI cover the same requirement already, correctly
	; scoped to C++ only by ESP-IDF's own CMake build (confirmed sufficient -
	; NimBLE's C++ BLE classes, which need both, compiled fine with only the
	; Kconfig options set).
	-DBOARD_MODEL=0xF2
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	; arduino-cli's FQBN for this board is esp32:esp32:esp32s3:CDCOnBoot=cdc -
	; that menu option sets exactly this define (platform.txt). Without it,
	; Serial doesn't bind to the full CDC-ACM USB endpoint the KISS host
	; protocol needs (esp32-s3-devkitc-1's own board defaults don't set it),
	; which silently broke host communication - the device booted and ran
	; fine, but writes to the KISS serial port just hung forever.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; HAS_URNS is not set here - Boards.h's own BOARD_MESHADVENTURER_S3 block
	; (selected via BOARD_MODEL above) already defines it unconditionally;
	; redefining it here on the command line just triggered a harmless but
	; noisy "HAS_URNS redefined" warning in every translation unit.
	-DMSGPACK_USE_BOOST=OFF
	; Silences the vendored DebugLog dependency's own "#warning: no log
	; level defined, defaulting to TRACE" - explicitly opting into the
	; exact same default it would otherwise pick doesn't change behavior,
	; just the noisy warning (fired once per TU that includes MsgPack.h).
	-DDEBUGLOG_DEFAULT_LOG_LEVEL_TRACE
	-DRNS_USE_FS
	-DUSTORE_USE_LITTLEFS
	; Redirects microReticulum's own heaviest STL-container usage (Bytes::Data
	; - the backing storage for every Bytes object in the whole RNS/LXMF/
	; Provisioning stack -, Transport::PathTable/AnnounceTable/NeighborStat,
	; Identity::KnownStore, Destination::PathStore - see Utilities/Memory.h's
	; ContainerAllocator<T>) from internal DRAM to PSRAM via ps_malloc (with
	; automatic heap fallback if PSRAM alloc fails - see ContainerAllocator::
	; allocate()). Was never set before, so it silently defaulted to
	; RNS_HEAP_ALLOCATOR (Memory.cpp) - i.e. plain internal-heap new/delete -
	; on ESP32. microReticulum_Firmware sets this on all its PSRAM-equipped
	; board envs; nothing else about their build differs for this (no
	; ESP-IDF sdkconfig/WiFi/mbedTLS/NimBLE PSRAM tuning at all).
	-DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
	; Transport.cpp only registers the "/provision" request handler on the
	; remote.management destination when BOTH of these are defined (see the
	; #if around Transport::start()'s remote-management block) - without
	; them, remote_management_enabled(true) still stands up the destination
	; and its /status and /path handlers, but /provision silently isn't
	; there, so RNS::Provisioning::Provisioner is unreachable over RNS
	; (local KISS is unaffected either way - Provisioning.h's
	; on_provision_request() calls Provisioner::instance() directly).
	-DRNS_ENABLE_REMOTE_PROVISIONING
	-DRNS_USE_PROVISIONING
	; Tried setting RNS_PATH_TABLE_SEGMENT_SIZE=24576 (Transport::
	; _path_store, PathStore = microStore::BasicFileStore, defaults to
	; 65536 bytes/segment x 8 segments when unset) to match
	; microReticulum_Firmware's own smaller value on boards that run
	; BLE+WiFi+Transport together. Reverted: caused a reproducible stack-
	; canary/heap-corruption crash (Guru Meditation, IDLE0/IDLE1 canary
	; watchpoint) within seconds of Transport starting, on real hardware -
	; a non-default segment size is apparently a genuinely untested path
	; in that vendored library. Bisected cleanly: reverting *only* this
	; flag (task consolidation left in place) made the crash disappear
	; across repeated boots. Since PathStore data is file-backed (disk,
	; not internal-DRAM-resident) this was always a low-confidence lever
	; for the actual internal-DRAM problem anyway - not worth chasing the
	; underlying library bug for. Left at the library's own default.
	; See [env:meshpoe_s3]'s own comment on this - same reasoning, matches
	; a genuine microReticulum node's own logging verbosity.
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
	; The generic "esp32-s3-devkitc-1" board JSON has no PSRAM SKU variant,
	; so unlike e.g. esp32-s3-devkitc-1-n16r8v it never sets this itself -
	; board_build.arduino.memory_type=qio_opi above correctly selects the
	; Octal-PSRAM Arduino core variant's headers/libs (confirmed via
	; compile_commands.json), but PlatformIO's own espressif32 builder only
	; ever derives -DBOARD_HAS_PSRAM from a board's "build.extra_flags",
	; never from memory_type - without this, psramFound() silently reads 0
	; even though the qio_opi variant itself is otherwise correctly linked.
	-DBOARD_HAS_PSRAM
	; Arduino-ESP32's loop() task defaults to an 8KB stack
	; (ARDUINO_LOOP_STACK_SIZE, main.cpp) - fine for the firmware alone, but
	; the onboard microReticulum/LXMF node's synchronous per-packet
	; processing (Transport::inbound()'s announce/path-table handling,
	; LXMRouter's inbound/outbound queues, MessageStore's ArduinoJson/
	; LittleFS I/O - all called from urns_reticulum.loop()/urns_lxmf_loop()
	; on this same task, every loop() iteration) goes several calls deeper
	; than anything else in this firmware. Real hardware testing (Messenger
	; feature work) surfaced random reboots reachable purely from receiving
	; real LXMF announces/messages over the air - with zero menu/UI
	; interaction - which a plain default-stack overflow explains far
	; better than a bug in any specific handler.
	; 16384 fixed the idle/background reboots (receiving announces/messages)
	; but sending still crashed - the send path goes deeper still (Ed25519
	; signing in LXMessage::pack(), handle_outbound()'s queuing, plus our
	; own save_message() write) on top of the same call chain. RAM headroom
	; is ample (~69% free at 8KB), so go straight to 32KB rather than
	; re-guess a second time.
	-DARDUINO_LOOP_STACK_SIZE=32768

lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	links2004/WebSockets@^2.7.2
	https://github.com/attermann/Crypto.git
	; ^ replaces rweather/Crypto for our own Ed25519 use too - attermann's
	; fork is the same lineage (same file set: AES/Ed25519/Curve25519/etc.),
	; kept as one copy to avoid a duplicate "Crypto" lib_deps collision now
	; that microReticulum (below) needs it too.
	bblanchon/ArduinoJson@~7.4.2
	; MsgPack comes from lib/MsgPack (vendored, one-method + one-member
	; visibility patch for microLXMF - see that file's own comments)
	; instead of the registry, so it's deliberately not listed here.
	; microStore (lib/microStore), microReticulum (lib/microReticulum), and
	; microLXMF (lib/microLXMF) are all vendored locally now rather than
	; fetched via lib_deps/git URL - needed temporary debug instrumentation
	; to track down the recall()/remember() bug (see
	; project_microreticulum_onboard_node memory).

[env:meshpoe_s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions/meshpoe_s3_urns.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 6291456

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>
	; ^ see [env:meshadventurer_s3]'s own comment on this same filter.

build_unflags =
	-std=gnu++11
	-fno-exceptions
	-fno-rtti
build_flags =
	-std=gnu++17
	-fexceptions
	-frtti
	-DBOARD_MODEL=0xF1
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	; See [env:meshadventurer_s3]'s own comment on ARDUINO_USB_CDC_ON_BOOT -
	; same reasoning applies here. This board's Makefile/arduino-cli FQBN
	; also explicitly sets ARDUINO_USB_MODE=1 (Hardware CDC and JTAG, vs.
	; the USB-OTG/TinyUSB mode 0) - mirrored here for parity, since
	; MeshAdventurer-S3's own arduino-cli target doesn't set it and its
	; PlatformIO env has never needed it either.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; HAS_URNS is not set here - Boards.h's own BOARD_MESHPOE_S3 block
	; (selected via BOARD_MODEL above) already defines it unconditionally;
	; redefining it here on the command line just triggered a harmless but
	; noisy "HAS_URNS redefined" warning in every translation unit.
	-DMSGPACK_USE_BOOST=OFF
	; Silences the vendored DebugLog dependency's own "#warning: no log
	; level defined, defaulting to TRACE" - explicitly opting into the
	; exact same default it would otherwise pick doesn't change behavior,
	; just the noisy warning (fired once per TU that includes MsgPack.h).
	-DDEBUGLOG_DEFAULT_LOG_LEVEL_TRACE
	-DRNS_USE_FS
	-DUSTORE_USE_LITTLEFS
	; See [env:meshadventurer_s3]'s own comment on this allocator - same
	; reasoning, this board has the same 8MB Octal PSRAM.
	-DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
	; See [env:meshadventurer_s3]'s own comment on these two.
	-DRNS_ENABLE_REMOTE_PROVISIONING
	-DRNS_USE_PROVISIONING
	; See [env:meshadventurer_s3]'s own comment on RNS_PATH_TABLE_SEGMENT_
	; SIZE - tried and reverted, reproducibly crashed real hardware on
	; this exact board (bisected here first).
	; Compile-time ceiling (Log.h) - macros above this level compile to
	; ((void)0) no-ops regardless of the runtime RNS::loglevel() call
	; (urns_init(), URNS.h). Defaults to RNS_LOG_LEVEL_VERBOSE when unset,
	; which was silently discarding every DEBUG()/TRACE() call in the
	; vendored library no matter what runtime level was configured. User
	; wants output matching a genuine microReticulum node's own verbosity
	; (confirmed via a real captured boot log showing TRACE-tagged '---'
	; lines) - raised to TRACE here to match.
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_TRACE
	; See [env:meshadventurer_s3]'s own comment on this - same board family,
	; same PSRAM situation (feedback_meshpoe_s3_psram_opi memory: 8MB PSRAM
	; is Octal not Quad on both boards).
	-DBOARD_HAS_PSRAM
	; HAS_LXMF was flipped back to true on this board (Boards.h, after
	; root-causing the unpack_from_bytes() field-count bug) - this stack
	; override was never revisited to match. Same reasoning as
	; meshadventurer_s3's own comment above applies now: Messenger.h/
	; LXMRouter/MessageStore's synchronous per-packet call chains
	; (announce/path-table handling, LXMRouter's queues, MessageStore's
	; ArduinoJson/LittleFS I/O, Ed25519 signing on send) run several calls
	; deeper than the base firmware, on this same loop()-owned task. Left
	; at the 8KB default for a while after HAS_LXMF came back on (that
	; env-comment's own self-warning: "watch for any stack-overflow-shaped
	; reboots under real radio/announce load") - live testing this session
	; found exactly that: a deterministic heap-tail corruption (always the
	; same address, same overwritten bytes) that only ever surfaces
	; downstream, in whatever unrelated allocator call next walks the
	; corrupted TLSF free list (seen crashing inside the SSD1306 display
	; code's own draw call AND inside the WiFi/PHY driver's ppTask, on
	; totally different boots) - a heap-adjacent stack overflow explains
	; that scattershot blast radius far better than a bug in any one
	; specific handler. Matching meshadventurer_s3's own proven-safe value.
	; TEMPORARY DIAGNOSTIC (2026-08-15): doubled to 65536 to test whether
	; the persistent stack-canary crash chased all this session (survived
	; every DIO0/masking/task-architecture/watchdog fix tried) is genuine
	; stack exhaustion. If this alone resolves it, 32768 was insufficient
	; and this becomes the real fix (right-sized down from here, not left
	; at this exact doubled value); if not, rules out stack exhaustion
	; entirely and redirects the investigation to heap corruption instead.
	-DARDUINO_LOOP_STACK_SIZE=65536

lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	links2004/WebSockets@^2.7.2
	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2
	; See [env:meshadventurer_s3]'s own comment on MsgPack/microStore/
	; microReticulum/microLXMF all being vendored under lib/ instead of
	; listed here.

[env:heltec_t096]
; Not a HAS_URNS board - added purely as a fast, reliable local build target
; for regression-checking non-HAS_URNS boards (see this file's own header
; comment). nRF52840, not ESP32 - a completely different platform/framework
; from the two envs above.
;
; PlatformIO's own bundled nordicnrf52 platform has no idea this board
; exists (its stock framework-arduinoadafruitnrf52 package is upstream
; adafruit/Adafruit_nRF52_Arduino, no HT-n5262G variant in it) - Heltec
; ships their own fork of that same core (build.core=nRF5) with the
; variant/linker-script this board actually needs, same directory layout
; PlatformIO's platform expects (cores/nRF5/, variants/HT-n5262G/,
; libraries/).
;
; platform_packages pointed straight at Heltec's raw repo/checkout (via
; git URL or symlink://) does NOT work: their repo has no root-level
; package.json, and PlatformIO's manifest search (package/manager/
; base.py's find_pkg_root()) falls back to a recursive os.walk() that
; picks up the FIRST package.json it finds anywhere in the tree - which
; turned out to be tools/midi_tests/package.json, an unrelated leftover
; MIDI test tool. PlatformIO then silently treats that whole subdirectory
; as if it were the entire package (confirmed live: it replaced this
; machine's global framework-arduinoadafruitnrf52 install with just that
; midi tool's rx.js/tx.js - reinstalled the real one with
; `pio pkg install -g -t platformio/framework-arduinoadafruitnrf52`
; afterward). Fixed by vendoring through .pio_vendor/heltec_nrf52_framework/
; instead - a small, gitignored, symlinks-only directory (regenerate with
; ../RNode_Scripts_PIO/setup/setup_heltec_nrf52_pio.sh, requires arduino-cli's
; Heltec_nRF52 board package installed) with its own correct root package.json
; and symlinks
; to only cores/variants/libraries/boards.txt/platform.txt - deliberately
; not tools/, which is what contains the poison-pill file. PlatformIO
; finds the correct manifest immediately and never walks any further.
; Shared with [env:heltec_t114] below - same underlying core, different
; board variant within it.
platform = nordicnrf52
board = heltec_t096
framework = arduino
platform_packages =
	platformio/framework-arduinoadafruitnrf52 @ symlink://./.pio_vendor/heltec_nrf52_framework
monitor_speed = 115200

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>
	; lib/ (vendored microReticulum/microLXMF/MsgPack) is never reachable
	; from this board - HAS_URNS is false, so Utilities.h's own #include for
	; those headers is preprocessed out - excluded anyway, same as the two
	; HAS_URNS envs above, so PlatformIO's library scanner never considers
	; it at all.

build_flags =
	-DBOARD_MODEL=0xD2
	; The Makefile normally injects a real `git rev-list --count HEAD`
	; value here - not critical for local iteration builds, so left at a
	; fixed fallback (same convention the two envs above use).
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"

; PlatformIO doesn't inherit lib_deps across [env:] sections, so this
; repeats the same list as the two envs above, minus WebSockets - unlike
; the others (harmless if unused, PlatformIO's library dependency finder
; only compiles what's #included from reachable code), WebSockets' own
; internals unconditionally #include Ethernet.h (for the ESP32/Arduino-
; Ethernet-shield WebSocketsServer path) regardless of whether anything
; here reaches WebSocketRemote.h - not available/needed on this non-ESP32,
; non-HAS_WIFI board, so excluded entirely rather than satisfied.
; Crypto (Ed25519) turned out to be needed unconditionally (Device.h) -
; found by letting the build fail forward through each missing header.
lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit BME280 Library@^2.3.0
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit BusIO@^1.17.4
	adafruit/Adafruit GFX Library@^1.12.6
	adafruit/Adafruit NeoPixel@^1.15.4
	adafruit/Adafruit SSD1306@^2.5.16
	adafruit/Adafruit Unified Sensor@^1.1.15
	https://github.com/attermann/Crypto.git
	bblanchon/ArduinoJson@~7.4.2

; Heltec's own core bundles a proprietary LoRaWAN stack library
; (libraries/Heltec_nrf_lorawan/, but declares itself simply as "Heltec"
; in its own library.json/library.properties - that's the name lib_ignore
; actually has to match, not the folder name) - this firmware never uses
; it (we have our own sx126x.cpp/sx127x.cpp/sx128x.cpp radio drivers), but
; PlatformIO's library scanner was pulling it in anyway and failing to
; compile it (it needs Adafruit_LittleFS.h, a library this env doesn't
; have/need either).
;
; The vendored URNS stack (microReticulum/microLXMF/MsgPack/microStore,
; lib/*) also needs excluding here, and for a subtler reason than "unused
; on this board": PlatformIO's library dependency finder (LDF) resolves
; #include chains via a text scan, not the real preprocessor - it doesn't
; know HAS_URNS is false and Utilities.h's own #include of URNS.h (which
; pulls all of these in transitively) never actually fires, so it tries to
; compile them anyway. They fail outright here: this env has none of the
; -fexceptions/-frtti/-std=gnu++17/RNS_USE_FS/USTORE_USE_LITTLEFS build
; flags the two HAS_URNS envs above set specifically for this vendored
; stack (real behavior requirement, not something to also apply here -
; this board doesn't have the storage/RAM budget to run it, matching
; HAS_URNS's own compile-time exclusion).
lib_ignore =
	Heltec
	microReticulum
	microLXMF
	MsgPack
	microStore

[env:heltec_t1]
; Heltec Mesh Node T1 (Boards.h: BOARD_HELTEC_T1, 0x47) - another sibling
; in the same Heltec_nRF52 core family as heltec_t096/heltec_t114 above,
; same vendored-symlink shim (.pio_vendor/heltec_nrf52_framework/,
; setup_heltec_nrf52_pio.sh) since its own "HT-mesh-node-t1" variant lives
; in the same variants/ directory that shim already symlinks - no separate
; vendoring step needed. board = heltec_t1 resolves against this repo's
; own boards/heltec_t1.json (same mechanism as heltec_t096/heltec_t114's
; own boards/*.json), mirroring the FQBN's actual boards.txt entry.
platform = nordicnrf52
board = heltec_t1
framework = arduino
platform_packages =
	platformio/framework-arduinoadafruitnrf52 @ symlink://./.pio_vendor/heltec_nrf52_framework
monitor_speed = 115200

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>


; -DBOARD_MODEL=0x35 (BOARD_GENERIC_ESP32), not 0xF3. Confirmed this is a
; pre-existing Makefile bug (unrelated to this migration) and not
; intentional sharing - fixed here to the real 0xF3 profile per user
; request, so this env now diverges from what the Makefile's own arduino-cli
; target currently produces until that's fixed there too.

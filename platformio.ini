[env:heltec32v4pa]
; Not a HAS_URNS board - same reasoning as [env:heltec_t096] above, but
; ESP32-S3 this time (arduino-cli FQBN "esp32:esp32:esp32s3:CDCOnBoot=cdc" -
; the generic ESP32S3 dev-board profile, no Heltec-specific FQBN exists for
; this board at all - matches board = esp32-s3-devkitc-1 below). No custom
; platform_packages override needed here (unlike T096/T114) - PlatformIO's
; own espressif32 platform already has everything this needs.
;
; PSRAM: real hardware has 16MB flash + QSPI (not Octal, unlike
; meshadventurer_s3/meshpoe_s3's 8MB Octal PSRAM above) PSRAM, both
; disabled by default under the generic esp32s3 profile's own defaults -
; confirmed against the actual vendor board (esp32:esp32:
; heltec_wifi_lora_32_V4, --show-properties: build.flash_size=16MB,
; build.psram_type=qspi, PSRAM menu's "enabled" option adds
; -DBOARD_HAS_PSRAM) even though the Makefile deliberately avoids that
; FQBN for the *compile defines* it also carries (LoRaWAN-region-locked,
; -DUSE_NONE_PA - conflicts with "Heltec V4 with PA", the commit that
; added this board) - the underlying hardware facts (flash size, PSRAM
; presence/type) aren't part of that conflict, so they're honored here.
; qio_qspi (not qio_opi) is the correct memory_type for this board's own
; Quad, not Octal, PSRAM chip - same field, different value, from
; meshadventurer_s3/meshpoe_s3's own PSRAM setup above. Confirmed on real
; hardware (ESP.getPsramSize(), temporary standalone diagnostic sketch):
; psramFound()=1, 2MB PSRAM, 16MB flash - PSRAM size itself isn't
; something to declare anywhere here, it's auto-probed by psramInit() at
; boot once BOARD_HAS_PSRAM/memory_type are correct (unlike flash size,
; which is baked into the bootloader image header via board_upload.
; flash_size above).
;
; Partition table is the stock "No OTA (2MB APP/2MB SPIFFS)" scheme
; (Makefile's own build.partitions=no_ota) - referenced by bare filename
; below since PlatformIO's espressif32 framework already bundles an
; identical no_ota.csv (tools/partitions/no_ota.csv, diffed byte-for-byte
; against arduino-cli's own copy), no need to vendor a project-local copy
; the way meshadventurer_s3/meshpoe_s3 do for their own custom URNS scheme.
; Only uses the first 4MB of the real 16MB flash, same as upstream's own
; Makefile target - unrelated to the PSRAM/flash-size correction above,
; not touched here.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = no_ota.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 2097152

build_src_filter =
	+<*>
	-<Console/*>
	-<Builds/*>
	-<Release/*>
	-<Documentation/*>
	-<build/*>
	-<Python Module/*>
	-<.pio_build/*>
	-<lib/*>

build_flags =
	-DBOARD_MODEL=0x3F
	!python -c "import subprocess; c=subprocess.run(['git','rev-list','--count','HEAD'],capture_output=True,text=True).stdout.strip(); print('-DBUILD_NUMBER=' + (c if c.isdigit() else '0'))"
	; See [env:meshadventurer_s3]'s own comment on ARDUINO_USB_CDC_ON_BOOT/
	; ARDUINO_USB_MODE - same CDCOnBoot=cdc FQBN option, confirmed via
	; --show-properties this board's FQBN resolves both the same way.
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	; Enables psramInit()/psramFound() at runtime - see this env's own
	; PSRAM comment above (board_build.arduino.memory_type) for why this
	; board's real hardware has PSRAM even though the Makefile's own
	; arduino-cli target doesn't currently enable it either (same
	; PSRAM-menu-defaults-to-disabled situation, not something specific to
	; this PlatformIO env).
	-DBOARD_HAS_PSRAM

; PlatformIO doesn't inherit lib_deps across [env:] sections - see
; [env:heltec_t096]'s own comment on this list (WebSockets works fine
; here, unlike on T096/T114 - this is ESP32, Ethernet.h is satisfied by
; this repo's own root-level Ethernet.h on the include path, same as it
; already is for meshadventurer_s3/meshpoe_s3 above).

name: Build Firmware

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: docker
    container:
      image: node:20-bookworm
    defaults:
      run:
        working-directory: RNode_Firmware
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          path: RNode_Firmware

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates git build-essential python3 python-is-python3 pip zip unzip
          rm -rf /var/lib/apt/lists/*

      - name: Install arduino-cli
        run: curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh

      - name: Cache arduino-cli cores and libraries
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino15-${{ hashFiles('RNode_Firmware/arduino-cli.yaml', 'RNode_Firmware/Makefile') }}
          restore-keys: |
            arduino15-

      - name: Install board cores and libraries
        env:
          ARDUINO_NETWORK_PROXY: http://192.168.0.4:3128
          HTTP_PROXY: http://192.168.0.4:3128
          HTTPS_PROXY: http://192.168.0.4:3128
          http_proxy: http://192.168.0.4:3128
          https_proxy: http://192.168.0.4:3128
        run: make prep prep-nrf

      - name: Compile all firmware targets
        run: make firmware-all
